# Deploy SecHub (hub/) lên GitHub Pages.
# Yêu cầu: repo Settings → Pages → Source = "GitHub Actions" (xem README §SecHub Online).
name: Deploy SecHub to GitHub Pages

on:
  push:
    branches: [main]
    paths: [hub/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload hub artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hub/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
